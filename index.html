<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ff">
  <meta name="description" content="An endless Nonogram puzzle loop by PrasannaOne.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/nonogram-192.png">
  <link rel="apple-touch-icon" href="icons/nonogram-192.png">
  <title>Nonogram · PrasannaOne</title>
  <link rel="stylesheet" href="web-port/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>Nonogram</h1>
      <div class="difficulty-switch" role="group" aria-label="Choose puzzle difficulty">
        <button type="button" data-difficulty="easy" aria-pressed="true">Easy</button>
        <button type="button" data-difficulty="normal" aria-pressed="false">Normal</button>
        <button type="button" data-difficulty="hard" aria-pressed="false">Hard</button>
      </div>
    </header>

    <section class="game-area" aria-label="Nonogram puzzle">
      <div class="level-row">
        <div class="level-indicator" aria-live="polite">LEVEL <strong id="levelNumber">1</strong></div>
        <div class="hint-actions">
          <div class="points-balance" aria-label="Points balance"><span id="pointsBalance">0</span> pts</div>
          <button class="hint-button" id="hintButton" aria-label="Reveal one correct cell, costs 5 points"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8.2 14.5A7 7 0 1 1 15.8 14.5c-.9.7-1.3 1.5-1.3 2.5h-5c0-1-.4-1.8-1.3-2.5Z"/></svg><span>Hint · 5</span></button>
        </div>
      </div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="group" aria-label="Puzzle grid"></div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <nav class="toolbar" aria-label="Tile tools">
      <button class="tool-button" id="undoButton" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg><span>Undo</span></button>
      <button class="tool-button active" data-tool="fill" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span>Fill</span></button>
      <button class="tool-button" data-tool="cross" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg><span>Cross</span></button>
    </nav>
  </main>

  <script type="module" src="web-port/app.js"></script>
</body>
</html>
