name: Import Nonogram ZIP

on:
  push:
    branches: [main]
    paths:
      - "Nonogram.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nonogram-zip-import
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove old site and extract uploaded package
        shell: bash
        run: |
          set -euo pipefail
          test -s Nonogram.zip

          python - <<'PY'
          import shutil
          import stat
          import zipfile
          from pathlib import PurePosixPath

          archive_path = "Nonogram.zip"

          # Validate the complete archive before changing the repository.
          with zipfile.ZipFile(archive_path) as archive:
              entries = archive.infolist()
              for item in entries:
                  path = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink entries are not allowed: {item.filename}")

          # Preserve GitHub Actions configuration and the uploaded archive.
          # Remove all other repository-root content so stale site files cannot survive.
          from pathlib import Path
          root = Path(".")
          for item in root.iterdir():
              if item.name in {".git", ".github", "Nonogram.zip"}:
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          # Extract only after validation and cleanup.
          with zipfile.ZipFile(archive_path) as archive:
              archive.extractall(".")
              print(f"Extracted {len(archive.infolist())} entries")

          Path("Nonogram.zip").unlink(missing_ok=True)
          Path(".nojekyll").touch()
          PY

      - name: Commit cleaned and extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Replace old Nonogram site with uploaded package"
          git push origin HEAD:main
